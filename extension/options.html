<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>企查查速查助手 · 设置</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;padding:40px 16px;color:#1c2438;}
  .card{max-width:460px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:28px 30px;}
  h1{font-size:20px;margin:0 0 6px;}
  .sub{font-size:13px;color:#808695;margin:0 0 18px;line-height:1.7;}
  label{display:block;font-size:13px;color:#515a6e;margin:14px 0 6px;}
  input{width:100%;box-sizing:border-box;height:38px;padding:0 12px;border:1px solid #dcdee2;border-radius:8px;font-size:14px;outline:none;}
  input:focus{border-color:#2d8cf0;}
  .row{display:flex;gap:10px;margin-top:22px;}
  button{flex:1;height:38px;border:none;border-radius:8px;font-size:14px;cursor:pointer;}
  .save{background:#2d8cf0;color:#fff;}
  .save:hover{background:#3d9bf5;}
  .clear{background:#f2f3f5;color:#515a6e;}
  .clear:hover{background:#e6e8eb;}
  #status{margin-top:14px;font-size:13px;color:#19be6b;min-height:18px;}
  .note{margin-top:18px;padding:12px 14px;background:#f8fcf6;border:1px solid #e3f2dc;border-radius:8px;font-size:12px;color:#536d3e;line-height:1.8;}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 IMS 账号管理</h1>
  <p class="sub">保存后，企查查/IMS 登录将自动完成，无需重复输入。</p>

  <label>IMS 账号</label>
  <input id="user" type="text" autocomplete="off">

  <label>IMS 密码（留空表示不修改已保存的密码）</label>
  <input id="pass" type="password" autocomplete="new-password" placeholder="">

  <div class="row">
    <button id="save" class="save">保存</button>
    <button id="clear" class="clear">清除已保存的账号密码</button>
  </div>
  <div id="status"></div>

  <div class="note">
    密码仅保存在<b>本机浏览器</b>的扩展存储（chrome.storage.local）中，不参与浏览器账号同步，
    不会上传到任何服务器，也不在代码仓库内。换电脑需重新输入一次。
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
